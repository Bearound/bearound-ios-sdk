name: iOS SDK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.0)'
        required: true
        type: string

env:
  PROJECT: BearoundSDK.xcodeproj
  SCHEME: BearoundSDK
  DERIVED_DATA: DerivedData

jobs:
  pre_release_validation:
    name: Pre-Release Validation
    runs-on: macos-latest
    timeout-minutes: 45

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Xcode LTS
        uses: maxim-lobanov/setup-xcode@v1

      - name: Resolve release version
        id: get_version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Verify podspec versions match release
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          echo "Version from tag/dispatch: $VERSION"

          for SPEC in BearoundSDK.podspec BearoundSDKNotificationExtensions.podspec; do
            SPEC_VERSION=$(grep -E 'spec\.version\s*=' "$SPEC" | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
            echo "Version from $SPEC: $SPEC_VERSION"
            if [ "$VERSION" != "$SPEC_VERSION" ]; then
              echo "❌ Version mismatch between tag ($VERSION) and $SPEC ($SPEC_VERSION)"
              exit 1
            fi
          done
          echo "✅ Versions match: $VERSION"

      - name: Verify Xcode MARKETING_VERSION matches release
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          MV=$(grep -m1 -E 'MARKETING_VERSION = ' BearoundSDK.xcodeproj/project.pbxproj | sed -E 's/.*= ([0-9.]+);/\1/')
          echo "tag=$VERSION pbxproj MARKETING_VERSION=$MV"
          if [ "$VERSION" != "$MV" ]; then echo "❌ MARKETING_VERSION ($MV) != release ($VERSION)"; exit 1; fi
          echo "✅ MARKETING_VERSION matches"

      - name: Verify SDKVersion constant matches release
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          SV=$(grep -m1 -E 'static let current = ' BearoundSDK/Constants.swift | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "tag=$VERSION SDKVersion.current=$SV"
          if [ "$VERSION" != "$SV" ]; then echo "❌ SDKVersion.current ($SV) != release ($VERSION)"; exit 1; fi
          echo "✅ SDKVersion constant matches"

      - name: Verify changelog entry
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found"
            exit 1
          fi
          if ! grep -q "## \\[${VERSION}\\]" CHANGELOG.md; then
            echo "❌ Version ${VERSION} not documented in CHANGELOG.md"
            exit 1
          fi
          echo "✅ Changelog contains entry for ${VERSION}"

      - name: Extract changelog for version
        id: extract_changelog
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          # Extract changelog section for this version using Python
          python3 << 'PYTHON_SCRIPT' > release_notes.md
          import sys
          import re

          version = "${{ steps.get_version.outputs.version }}"

          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          # Find the section for this version
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)

          if match:
              notes = match.group(1).strip()
              print(notes)
          else:
              print(f"Release notes for version {version}")
          PYTHON_SCRIPT

          # Display for debugging
          echo "📝 Release notes extracted:"
          cat release_notes.md

          # Save to output for GitHub Actions
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.get_version.outputs.version }}
          path: release_notes.md

      - name: Lint podspecs
        run: |
          for SPEC in BearoundSDK.podspec BearoundSDKNotificationExtensions.podspec; do
            pod lib lint "$SPEC" \
              --allow-warnings \
              --platforms=ios \
              --skip-import-validation
          done

      - name: Build XCFramework
        run: |
          chmod +x build_framework.sh
          ./build_framework.sh

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: BearoundSDK-xcframework-${{ steps.get_version.outputs.version }}
          path: build/BearoundSDK.xcframework

  publish_to_cocoapods:
    name: Publish to CocoaPods
    runs-on: macos-latest
    needs: [pre_release_validation]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Xcode LTS
        uses: maxim-lobanov/setup-xcode@v1

      - name: Push to trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "❌ Missing COCOAPODS_TRUNK_TOKEN secret"
            exit 1
          fi

          VERSION=${{ needs.pre_release_validation.outputs.version }}

          # "yes" when trunk already lists $VERSION for pod $1 (no auth needed).
          is_published() {
            curl -s "https://trunk.cocoapods.org/api/v1/pods/$1" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              versions = [v['name'] for v in data.get('versions', [])]
              print('yes' if '${VERSION}' in versions else 'no')
          except:
              print('no')
          " 2>/dev/null
          }

          # Pushes one podspec. Skipped when the version is already on trunk. A failed push is
          # re-checked before failing the job: trunk often accepts the spec and then times out
          # the client, so the version shows up a few minutes later.
          push_pod() {
            local POD="$1" SPEC="$2"
            if [ "$(is_published "$POD")" = "yes" ]; then
              echo "✅ $POD ${VERSION} is already published on CocoaPods, skipping push"
              return 0
            fi
            if pod trunk push "$SPEC" \
                --allow-warnings \
                --skip-import-validation \
                --synchronous; then
              echo "✅ $POD ${VERSION} pushed"
              return 0
            fi
            echo "⚠️ pod trunk push $SPEC failed; checking whether trunk published it anyway"
            for i in $(seq 1 10); do
              sleep 30
              if [ "$(is_published "$POD")" = "yes" ]; then
                echo "✅ $POD ${VERSION} is on trunk despite the push error"
                return 0
              fi
            done
            echo "❌ $POD ${VERSION} is not on trunk"
            return 1
          }

          # Independent pods (the extensions pod does not depend on the core): both always
          # go out, and the job fails if either is missing.
          STATUS=0
          push_pod BearoundSDK BearoundSDK.podspec || STATUS=1
          push_pod BearoundSDKNotificationExtensions BearoundSDKNotificationExtensions.podspec || STATUS=1
          exit $STATUS

  create_github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pre_release_validation, publish_to_cocoapods]
    if: needs.publish_to_cocoapods.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.pre_release_validation.outputs.version }}

      - name: Download XCFramework
        uses: actions/download-artifact@v4
        with:
          name: BearoundSDK-xcframework-${{ needs.pre_release_validation.outputs.version }}
          path: BearoundSDK.xcframework

      - name: Create XCFramework zip
        run: |
          zip -r BearoundSDK-${{ needs.pre_release_validation.outputs.version }}.xcframework.zip BearoundSDK.xcframework

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.pre_release_validation.outputs.version }}
          name: BearoundSDK v${{ needs.pre_release_validation.outputs.version }}
          body_path: release_notes.md
          files: |
            BearoundSDK-${{ needs.pre_release_validation.outputs.version }}.xcframework.zip
          draft: false
          prerelease: false

  release_success:
    name: Release Success
    runs-on: ubuntu-latest
    needs: [pre_release_validation, publish_to_cocoapods, create_github_release]
    if: always() && needs.publish_to_cocoapods.result == 'success' && needs.create_github_release.result == 'success'

    steps:
      - name: Release completed successfully
        run: |
          echo "🎉 Release v${{ needs.pre_release_validation.outputs.version }} completed successfully!"
          echo "🚀 CocoaPods: Published"
          echo "📦 GitHub Release: Created"
